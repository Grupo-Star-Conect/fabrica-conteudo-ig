<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="fabrica-token" content="__TOKEN__">
<title>Fábrica de Conteúdo</title>
<style>
/* Fábrica de Conteúdo: barra lateral por momento do trabalho (Conversa, Conteúdo, Aprendizado, Perfil).
   Claro, limpo, cores Star Conect (marinho + sky). Sem build, sem dependência. */
:root{
  --bg:#f5f5f7; --side:#eef0f4; --surface:#fff; --surface-2:#f2f3f6; --line:#e2e4ea; --line-2:#d2d6df;
  --fg:#1d1d1f; --fg-2:#424245; --muted:#6e6e73;
  --brand:#243263; --brand-ink:#fff; --sky:#2f8fbf; --sky-soft:#e3f1f9;
  --ok:#1f7a3a; --ok-soft:#e5f4e9; --warn:#8a5a00; --warn-soft:#fbf1dc; --bad:#b4342d; --bad-soft:#fbe9e7;
  --reels:#5b4bb7; --reels-soft:#eeebfb; --carr:#0f7a6a; --carr-soft:#e2f4ef;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace; --r:12px; --sh:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#111318; --side:#16191f; --surface:#1c1f26; --surface-2:#242832; --line:#2c313c; --line-2:#3a404d;
  --fg:#f2f3f5; --fg-2:#c9ccd3; --muted:#8d929c; --brand:#6fb6dc; --brand-ink:#0d1117; --sky:#6fb6dc; --sky-soft:#18303e;
  --ok:#7fd093; --ok-soft:#173222; --warn:#efc56d; --warn-soft:#352a10; --bad:#f19a95; --bad-soft:#3a1c1a;
  --reels:#b9aef6; --reels-soft:#2a2650; --carr:#7fd9c6; --carr-soft:#143a34; --sh:none; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
html{accent-color:var(--brand);caret-color:var(--sky)}
::selection{background:var(--sky-soft);color:var(--fg)}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.prose{white-space:normal}.prose p{margin:0 0 8px}.prose p:last-child,.prose ul:last-child{margin-bottom:0}
.prose ul{margin:2px 0 10px;padding-left:18px}.prose li{margin:2px 0}
.prose .h{font-weight:600;color:var(--fg);margin:14px 0 4px;font-size:13.5px}.prose .h:first-child{margin-top:0}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--f);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--sky)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
/* barra lateral */
aside{background:var(--side);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;gap:10px;align-items:center;padding:0 8px 16px}
.brand svg{width:20px;height:27px;flex:none}
.brand b{font-size:15px;font-weight:600;letter-spacing:-.01em;display:block}
.brand small{color:var(--muted);font-size:12px}
.grp{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--fg-2);font-size:14px}
.nav:hover{background:rgba(127,127,140,.1)}
.nav[aria-current=true]{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:var(--sh)}
.nav .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav .dot{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--sky);color:#fff;font-size:11px;display:inline-grid;place-items:center;font-weight:600}
.convs{display:flex;flex-direction:column;gap:1px;margin:2px 0 0 8px;border-left:1px solid var(--line-2);padding-left:6px}
.convs .nav{font-size:13px;padding:5px 8px}.convs .nav span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* conteúdo */
main{min-width:0;padding:22px 28px 60px;max-width:1180px;width:100%}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
h1{font-size:24px;font-weight:600;letter-spacing:-.02em;margin:0;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sub{color:var(--muted);margin:2px 0 0;font-size:13px}
.btn{padding:7px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--fg-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 11px;font-size:12px}
.btn:disabled{opacity:.5;cursor:progress}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
input,textarea{padding:9px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);width:100%}
textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;margin-bottom:14px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--fg-2)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:var(--sh)}
.seg .n{color:var(--muted);margin-left:5px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);min-width:0}
.label{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.hint{color:var(--muted);font-size:12.5px;margin:8px 0 0}
.chip{display:inline-flex;align-items:center;font-size:11.5px;font-weight:500;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--fg-2)}
.chip.reels{background:var(--reels-soft);color:var(--reels)}.chip.carrossel,.chip.post{background:var(--carr-soft);color:var(--carr)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.sky{background:var(--sky-soft);color:var(--sky)}
.split{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
.list{display:flex;flex-direction:column;gap:6px}
.item{all:unset;box-sizing:border-box;display:block;cursor:pointer;padding:12px 14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.item:hover{border-color:var(--line-2)}
.item[aria-current=true]{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.item h3{margin:6px 0 3px;font-size:14px;font-weight:500;line-height:1.35}
.meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.block{background:var(--surface-2);border-radius:10px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px}
.sec{margin-top:20px}
.decide{margin-top:14px;padding:12px 0;border-block:1px solid var(--line)}
.d-h{font-size:21px;font-weight:600;letter-spacing:-.015em;margin:8px 0 6px;line-height:1.3}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slide{background:var(--surface-2);border-radius:10px;padding:10px;font-size:12.5px;white-space:pre-wrap}
.slide b{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
/* trilha em passos */
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:0 0 10px 34px}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--ok-soft);color:var(--ok);font-size:11.5px;font-weight:600;display:grid;place-items:center}
.steps li:not(:last-child)::after{content:"";position:absolute;left:10.5px;top:26px;bottom:2px;width:1px;background:var(--line-2)}
.steps summary{cursor:pointer;font-weight:500;list-style:none}.steps summary::-webkit-details-marker{display:none}
.steps .with{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.steps .block{margin-top:6px}
/* colunas de produção */
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;min-height:120px}
.col h4{margin:2px 4px 10px;font-size:12.5px;font-weight:600;color:var(--fg-2);display:flex;justify-content:space-between}
.col .item{margin-bottom:6px}
.col-vazia{margin:4px;font-size:12.5px;color:var(--muted)}
/* conversa */
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--brand-ink);border-bottom-right-radius:5px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;white-space:normal;font-size:14.5px;line-height:1.55}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin:0}.msg.a ul{margin:4px 0 8px;padding-left:20px}
.msg.err{border-color:var(--bad);color:var(--bad)}
.etapas{font-size:12px;color:var(--muted);margin-top:6px}.etapas summary{cursor:pointer}
.etapas div{font-family:var(--mono);font-size:11.5px;padding:1px 0}
.typing{color:var(--muted);font-size:12.5px;display:flex;gap:6px;align-items:center}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--sky);animation:p 1s infinite alternate}
@keyframes p{to{opacity:.25}}
.composer{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding-top:18px;margin-top:8px}
.composer form{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:var(--sh)}
.composer textarea{border:0;padding:6px 0;min-height:24px;max-height:180px;background:transparent;resize:none}
.composer textarea:focus-visible{outline:none}
.sugest{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
/* cartão confirmar */
.pend{border:1px solid var(--sky);background:var(--sky-soft);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.pend p{margin:0 0 8px;font-size:12.5px;color:var(--fg-2)}
.pend textarea{background:var(--surface);min-height:56px;font-size:13px}
.pend .antes{font-size:12px;color:var(--muted);max-height:120px;overflow:auto;white-space:pre-wrap;margin:6px 0}
/* atividade */
.job{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;margin-bottom:12px;font-size:13px}
.job details{flex:1;min-width:0}.job summary{cursor:pointer}
.job .log{font-family:var(--mono);font-size:11.5px;color:var(--muted);max-height:200px;overflow:auto;margin-top:6px}
.job.erro{border-color:var(--bad);color:var(--bad)}
.spin{width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--sky);border-radius:50%;animation:r .8s linear infinite;flex:none}
@keyframes r{to{transform:rotate(360deg)}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.num{background:var(--surface-2);border-radius:10px;padding:10px 12px}.num b{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}.num span{font-size:11.5px;color:var(--muted)}
.vid{cursor:pointer}.vid h3{margin:4px 0 6px;font-size:14.5px;font-weight:500}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:16px;text-align:center;color:var(--muted);cursor:pointer}
.drop.on{border-color:var(--sky);background:var(--sky-soft)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:9;max-width:90vw}
@media (max-width:860px){.app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{position:sticky;top:0;z-index:4;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;align-items:center;padding:10px 12px;gap:4px;border-right:0;border-bottom:1px solid var(--line)}.grp,.convs,.brand small,.brand div{display:none}.brand{padding:0 6px 0 0}.nav{width:auto;flex:none;white-space:nowrap}.split{grid-template-columns:1fr}main{padding:16px}.board{grid-template-columns:repeat(5,minmax(230px,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>
<script>
const TOKEN=document.querySelector('meta[name=fabrica-token]').content;
const S={v:"conversa",seg:{},sel:null,conv:null,convData:null,estado:null,jobs:{},fbTipo:{},abertos:{}};
const $=(q,el=document)=>el.querySelector(q);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ST={nova:"Nova",vou_usar:"Vou usar",guardada:"Guardada",descartada:"Descartada",arquivada:"Arquivada",produzindo:"Produzindo",pronto:"Pronto",gravada:"Gravado",com_equipe:"Com a equipe",publicada:"Publicado",analisada:"Analisado"};
const ETAPA_SKILL={"instagram-skills:ig-hook-extractor":"Gancho","instagram-skills:ig-carousel-planner":"Carrossel","instagram-skills:ig-caption-writer":"Legenda","instagram-skills:ig-hashtag-strategist":"Hashtags","instagram-skills:ig-humanizer":"Revisão anti-IA","watch:watch":"Assistir vídeo"};
const JOB_TXT={radar:"Buscando ideias",trazer:"Trazendo o assunto",analista:"Atualizando os números",vencidos:"Analisando posts de 7 dias",assistir:"Assistindo aos vídeos",produzir:"Produzindo o post",entregar:"Montando a entrega",print:"Lendo os prints",conversa:"Respondendo"};

async function api(path,body){
  const r=await fetch(path,{method:body?"POST":"GET",headers:{"X-Fabrica":TOKEN,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({erro:"resposta inválida"}));
  if(!r.ok) throw new Error(j.erro||"falhou");
  return j;
}
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=!t;clearTimeout(toast.t);if(t)toast.t=setTimeout(()=>el.hidden=true,5000)}
function copiar(txt,btn){navigator.clipboard.writeText(txt).then(()=>{const o=btn.textContent;btn.textContent="Copiado";setTimeout(()=>btn.textContent=o,1400)},()=>toast("Não deu pra copiar. Selecione o texto."))}
function md(t){ // markdown mínimo: parágrafo, lista, negrito, link
  const L=esc(t||"").split(/\n/);let h="",ul=false;
  for(let l of L){l=l.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>');
    if(/^\s*[-•*]\s+/.test(l)){if(!ul){h+="<ul>";ul=true}h+="<li>"+l.replace(/^\s*[-•*]\s+/,"")+"</li>";continue}
    if(ul){h+="</ul>";ul=false}
    if(/^#{1,4}\s/.test(l)){h+='<div class="h">'+l.replace(/^#+\s/,"")+"</div>";continue}
    if(l.trim())h+="<p>"+l+"</p>";}
  return h+(ul?"</ul>":"");
}
const semTitulo=t=>String(t||"").replace(/^# .*\n+/,"");
const dias=(a,b)=>Math.round((new Date(a)-new Date(b))/864e5);
const I=()=>S.estado?.ideias||[];
const doStatus=(...s)=>I().filter(i=>s.includes(i.status));
function tipoChip(t){if(!t)return"";const n={reels:"Reels",carrossel:"Carrossel",post:"Post fixo"}[t]||t;return `<span class="chip ${esc(t)}">${esc(n)}</span>`}

async function carregar(){
  try{S.estado=await api("/api/estado")}catch(e){toast("Perdi a conexão com a Fábrica. Ela ainda está aberta no Terminal?");return}
  for(const j of S.estado.jobs||[]) if(!S.jobs[j.id]) acompanhar(j);
  render();
}

/* ---------- barra lateral ---------- */
function side(){
  const e=S.estado,P=e.pendentes.length,V=e.vencidos.length;
  const n={ideias:doStatus("nova").length,producao:doStatus("vou_usar","produzindo","pronto","gravada","com_equipe").length,publicados:doStatus("publicada","analisada").length};
  const nav=(k,t,extra="")=>`<button class="nav" data-v="${k}" aria-current="${S.v===k}"><span>${t}</span>${extra}</button>`;
  const cnt=x=>x?`<span class="n">${x}</span>`:"";const dot=x=>x?`<span class="dot">${x}</span>`:"";
  $("#side").innerHTML=`<div class="brand"><svg viewBox="760.3 155.5 399.7 543.6" aria-hidden="true"><path fill="var(--brand)" d="M 1044.97 538.52 L 960.18 477.13 L 875.39 538.52 L 907.58 438.91 L 823 377.25 L 927.67 377.07 L 960.18 277.57 L 992.69 377.07 L 1097.37 377.25 L 1012.78 438.91 Z M 1151.57 399.33 C 1142.71 335.43 1088.08 287.86 1023.57 287.86 L 992.8 287.86 L 992.8 169.13 C 992.8 161.36 983.42 157.46 977.91 162.93 L 811.59 328.25 C 778.16 361.47 762.31 408.48 768.79 455.16 C 777.66 519.05 832.29 566.62 896.8 566.62 L 927.56 566.62 L 927.56 685.36 C 927.56 693.13 936.95 697.03 942.46 691.55 L 1108.78 526.23 C 1142.2 493.01 1158.05 446.01 1151.57 399.33"/></svg><div><b>Fábrica de Conteúdo</b><small>@${esc(e.config.handle||"")}</small></div></div>
  <div class="grp">Conversa</div>${nav("conversa","Nova conversa")}
  <div class="convs">${e.conversas.filter(c=>!c.ideia_id).slice(0,8).map(c=>`<button class="nav" data-conv="${esc(c.id)}" aria-current="${S.v==="conversa"&&S.conv===c.id}"><span>${esc(c.titulo)}</span></button>`).join("")}</div>
  <div class="grp">Conteúdo</div>${nav("ideias","Ideias",cnt(n.ideias))}${nav("producao","Produção",cnt(n.producao))}${nav("publicados","Publicados",V?dot(V):cnt(n.publicados))}
  <div class="grp">Aprendizado</div>${nav("aprendizado","O que a Fábrica sabe",dot(P))}${nav("videos","Vídeos analisados",cnt(e.videos.length))}
  <div class="grp">Perfil</div>${nav("perfil","Seu perfil")}`;
}

/* ---------- atividade (tarefas rodando) ---------- */
function jobsGlobais(filtro){
  return Object.values(S.jobs).filter(j=>!j.conversa&&(!filtro||filtro(j))&&(j.status==="rodando"||Date.now()-j.visto<45000)).map(jobBox).join("");
}
function jobBox(j){
  const t=JOB_TXT[j.acao]||"Trabalhando";
  const st=j.status==="rodando"?`<span class="spin"></span>`:j.status==="ok"?`<span class="chip ok">Pronto</span>`:`<span class="chip warn">Deu erro</span>`;
  return `<div class="job ${j.status==="erro"?"erro":""}">${st}<details ${S.abertos[j.id]?"open":""} data-jobd="${j.id}"><summary>${esc(t)}${j.status==="rodando"?` · ${j.segundos||0}s`:""}${j.eventos.length?` · ${esc(j.eventos[j.eventos.length-1].texto.slice(0,80))}`:""}</summary><div class="log" data-log="${j.id}">${j.eventos.map(ev=>`<div>${esc(ev.texto)}</div>`).join("")}${j.erro?`<div>${esc(j.erro)}</div>`:""}</div></details></div>`;
}

/* ---------- views ---------- */
function render(){
  if(!S.estado) return; S._c=[]; side();
  ({conversa:vConversa,ideias:vIdeias,producao:vProducao,publicados:vPublicados,aprendizado:vAprendizado,videos:vVideos,perfil:vPerfil,post:vPost})[S.v]();
}
function cab(t,sub,acts=""){return `<div class="top"><div><h1>${t}</h1>${sub?`<p class="sub">${sub}</p>`:""}</div><div class="row">${acts}</div></div>`}

function pendCards(filtro){
  const L=S.estado.pendentes.filter(filtro||(()=>true));
  return L.map(p=>`<div class="pend" data-pend="${p.id}"><p><b>A Fábrica quer guardar isto</b> em ${p.arquivo.startsWith("perfil/")?"seu perfil ("+esc(p.arquivo.slice(7,-3))+")":p.arquivo.includes("aprendizado")?"o que você ensinou":"a memória"}${p.origem?` · veio de ${esc(p.origem)}`:""}</p>
    ${p.antes?`<details><summary class="hint">Ver como está hoje</summary><div class="antes">${esc(p.antes)}</div></details>`:""}
    <textarea data-pendtxt="${p.id}">${esc(p.texto)}</textarea>

function chatHTML(c,ideiaId){

  const msgs=(c?.mensagens||[]).map(m=>m.role==="user"?`<div class="msg u">${esc(m.texto)}</div>`:
    `<div class="msg a ${m.erro?"err":""}">${md(m.texto)}${m.etapas?.length?`<details class="etapas"><summary>${m.etapas.length} etapa${m.etapas.length>1?"s":""}</summary>${m.etapas.map(x=>`<div>${esc(x)}</div>`).join("")}</details>`:""}</div>`).join("");
  const vivo=job?`<div class="msg a" data-vivo="${job.id}">${job.parcial?md(job.parcial):""}<div class="typing"><i></i>${esc(job.eventos.length?job.eventos[job.eventos.length-1].texto.slice(0,90):"Pensando…")}</div></div>`:"";

  if(["pronto","gravada","com_equipe"].includes(i.status)) h+=`<div class="sec card"><p class="label">Próximo passo</p><div class="row">${prox?`<button class="btn" data-status="${prox[0]}">${prox[1]}</button>`:""}${p?`<button class="btn" data-entregar="1" ${job?"disabled":""}>Montar pacote pra equipe</button>`:""}</div>
    <form class="row" id="pubForm" style="margin-top:12px"><input id="pubLink" style="flex:1;min-width:220px" placeholder="Link do post no Instagram (opcional, ajuda a achar)"><button class="btn primary">Marcar como publicado</button></form><p class="hint">Ao publicar, a Fábrica marca a análise pra daqui a 7 dias.</p></div>`;
  if(!p&&["vou_usar","produzindo"].includes(i.status)&&!job) h+=`<div class="sec card"><p class="label">Produzir</p><div class="row">${[["decida","A Fábrica escolhe o formato"],["reels","Reels"],["carrossel","Carrossel"],["post","Post fixo"]].map(([f,n],k)=>`<button class="btn ${k?"":"primary"}" data-produzir="${f}">${n}</button>`).join("")}</div></div>`;
  // material
  if(p){
    h+=`<div class="sec card"><p class="label">Material pronto</p>`;
    if(p.formato_motivo) h+=`<p class="hint" style="margin:0 0 12px">${esc(p.formato_motivo)}</p>`;
    if(p.roteiro) h+=sec("Roteiro falado",`<div class="block">${esc(p.roteiro)}</div>`,p.roteiro);
    if(p.slides?.length) h+=sec(`Slides · ${p.slides.length}`,`<div class="slides">${p.slides.map((s,k)=>`<div class="slide"><b>${k+1}</b>${esc(s)}</div>`).join("")}</div>`,p.slides.map((s,k)=>`Slide ${k+1}\n${s}`).join("\n\n"));
    if(p.texto_arte) h+=sec("Texto da arte",`<div class="block">${esc(p.texto_arte)}</div>`,p.texto_arte);
    if(p.legenda) h+=sec("Legenda",`<div class="block">${esc(p.legenda)}</div>`,p.legenda);
    if(p.hashtags?.length) h+=sec("Hashtags",`<div class="block">${esc(p.hashtags.join(" "))}</div>`,p.hashtags.join(" "));
    if(i.briefing){const b=typeof i.briefing==="string"?i.briefing:JSON.stringify(i.briefing,null,1);h+=sec("Briefing pra equipe",`<div class="block">${esc(b)}</div>`,b);}
    h+=`</div>`;
  }
  // trilha
  if(i.trilha?.length) h+=`<div class="sec card"><p class="label">Como a Fábrica chegou aqui · ${i.trilha.length} etapas</p><ol class="steps">${i.trilha.map(t=>`<li><details><summary>${esc(t.etapa)}${t.skill?`<span class="with">${esc(ETAPA_SKILL[t.skill]||(t.skill.includes(":")?"":t.skill))}</span>`:""}</summary><div class="block prose">${md(t.saida)}</div></details></li>`).join("")}</ol></div>`;

  if(p||S.convData?.mensagens?.length) h+=`<div class="sec"><p class="label">Ajustar conversando</p>${chatHTML(S.convData,i.id)}</div>`;
  $("#view").innerHTML=h;
}

function histHTML(t){
  const L=(t||"").split("\n").filter(l=>l.startsWith("- ")).reverse();
  if(!L.length) return `<p class="hint">Vazio.</p>`;
  let dia="",h="";
  for(const l of L){const m=l.match(/^- (\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}) · (.*)$/);if(!m){h+=`<div class="meta" style="padding:3px 0">${esc(l.slice(2))}</div>`;continue}
    if(m[1]!==dia){dia=m[1];h+=`<p class="label" style="margin:12px 0 4px">${esc(new Date(dia+"T12:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"}))}</p>`}
    h+=`<div style="display:flex;gap:10px;padding:3px 0;font-size:13px"><span class="meta" style="font-variant-numeric:tabular-nums">${m[2]}</span><span>${esc(m[3])}</span></div>`;}
  return h;
}

async function rodar(corpo){try{const j=await api("/api/rodar",corpo);acompanhar(j);render()}catch(e){toast(e.message)}}
function acompanhar(j){
  j.visto=Date.now(); j.eventos=j.eventos||[]; S.jobs[j.id]=j;
  const tick=async()=>{
    let r; try{r=await api(`/api/job/${j.id}/${j.eventos.length}`)}catch{return setTimeout(tick,3000)}
    j.eventos.push(...r.eventos); Object.assign(j,{status:r.status,erro:r.erro,segundos:r.segundos,parcial:r.parcial}); j.visto=Date.now();
    if(j.conversa){const box=document.querySelector(`[data-vivo="${j.id}"]`);
      if(box&&j.status==="rodando"){box.innerHTML=(j.parcial?md(j.parcial):"")+`<div class="typing"><i></i>${esc(j.eventos.length?j.eventos[j.eventos.length-1].texto.slice(0,90):"Pensando…")}</div>`;if(window.innerHeight+window.scrollY>document.body.scrollHeight-160)scrollFim()}}
    else{const box=document.querySelector(`[data-log="${j.id}"]`);if(box&&r.eventos.length){box.insertAdjacentHTML("beforeend",r.eventos.map(ev=>`<div>${esc(ev.texto)}</div>`).join(""));box.scrollTop=box.scrollHeight}
      const sm=box?.closest("details")?.querySelector("summary");if(sm&&j.eventos.length)sm.textContent=`${JOB_TXT[j.acao]||"Trabalhando"} · ${j.segundos}s · ${j.eventos[j.eventos.length-1].texto.slice(0,80)}`}
    if(j.status==="rodando") setTimeout(tick,j.conversa?600:1300);
    else{ if(j.erro&&!j.conversa) toast("Deu erro: "+j.erro.slice(0,200)); if(j.conversa) await abrirConv(S.conv&&S.v==="conversa"?S.conv:null,true); await carregar(); if(j.conversa)scrollFim(); }
  };
  setTimeout(tick,500);
}
async function abrirConv(id,manter){
  if(S.v==="post"){S.convData=await api("/api/conversa/post-"+S.sel).catch(()=>null);return}
  S.conv=id; S.convData=id?await api("/api/conversa/"+id).catch(()=>null):null;
}
async function abrirPost(id){S.sel=id;S.v="post";S.convData=await api("/api/conversa/post-"+id).catch(()=>null);render();window.scrollTo(0,0)}
async function enviarPrints(files){
  const imgs=await Promise.all([...files].filter(f=>f.type.startsWith("image/")).map(f=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)})));
  if(!imgs.length) return toast("Mande imagens (print da tela).");
  try{const j=await api("/api/print",{id:S.sel,imagens:imgs});acompanhar(j);render()}catch(e){toast(e.message)}
}

/* ---------- eventos ---------- */
document.addEventListener("click",async e=>{
  const b=e.target.closest("button,[data-sel],#drop"); if(!b) return;
  const d=b.dataset;
  if(b.id==="drop"){$("#printIn").click();return}
  if(d.v){S.v=d.v;S.sel=null;if(d.v==="conversa"){S.conv=null;S.convData=null}render();window.scrollTo(0,0);return}
  if(d.conv){S.v="conversa";await abrirConv(d.conv);render();scrollFim();return}
  if(d.seg){const[k,v]=d.seg.split(":");S.seg[k]=v;S.sel=null;render();return}
  if(d.sel){S.sel=d.sel;render();return}
  if(d.post){abrirPost(d.post);return}
  if(d.sug){const t=$("#chatIn");t.value=d.sug;t.focus();return}
  if(b.id==="radarBtn"){rodar({acao:"radar"});return}
  if(d.rodar){rodar({acao:d.rodar});return}
  if(d.copiar!=null){copiar(S._c[+d.copiar],b);return}
  if(d.salvar){try{await api("/api/salvar",{id:d.salvar,texto:$(`[data-pendtxt="${d.salvar}"]`).value});toast("Guardado.");await carregar()}catch(er){toast(er.message)}return}
  if(d.naosalvar){try{await api("/api/descartar-salvar",{id:d.naosalvar});await carregar()}catch(er){toast(er.message)}return}
  if(d.fbtipo){S.fbTipo[S.sel]=S.fbTipo[S.sel]===d.fbtipo?null:d.fbtipo;render();setTimeout(()=>$("#fbTxt")?.focus(),0);return}
  if(d.fbsalvar){try{await api("/api/feedback",{id:d.fbsalvar,tipo:S.fbTipo[d.fbsalvar],texto:$("#fbTxt")?.value||""});S.fbTipo[d.fbsalvar]=null;await carregar()}catch(er){toast(er.message)}return}
  if(d.produzir){const id=S.sel;await rodar({acao:"produzir",id,formato:d.produzir});if(S.v==="ideias")toast("Produzindo. Acompanhe em Produção.");return}
  if(d.entregar){rodar({acao:"entregar",id:S.sel});return}
  if(d.status){try{await api("/api/status",{id:S.sel,status:d.status});await carregar()}catch(er){toast(er.message)}return}
});
document.addEventListener("toggle",e=>{const d=e.target.dataset||{};if(d.jobd)S.abertos[d.jobd]=e.target.open;if(d.pf)S.abertos["pf"+d.pf]=e.target.open},true);
document.addEventListener("change",e=>{if(e.target.id==="printIn")enviarPrints(e.target.files)});
document.addEventListener("dragover",e=>{const z=e.target.closest?.("#drop");if(z){e.preventDefault();z.classList.add("on")}});
document.addEventListener("dragleave",e=>{e.target.closest?.("#drop")?.classList.remove("on")});
document.addEventListener("drop",e=>{const z=e.target.closest?.("#drop");if(z){e.preventDefault();enviarPrints(e.dataTransfer.files)}});
document.addEventListener("keydown",e=>{if(e.target.id==="chatIn"&&e.key==="Enter"&&!e.shiftKey){e.preventDefault();e.target.form.requestSubmit()}});
document.addEventListener("input",e=>{if(e.target.id==="chatIn"){e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,180)+"px"}});
document.addEventListener("submit",async e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==="trazerForm"){const v=$("#trazerIn").value.trim();if(!v)return toast("Escreva o assunto ou cole um link.");$("#trazerIn").value="";rodar({acao:"trazer",texto:v});return}
  if(f.id==="pubForm"){try{await api("/api/publicar",{id:S.sel,link:$("#pubLink").value.trim()});toast("Publicado. A análise fica marcada pra daqui a 7 dias.");await carregar()}catch(er){toast(er.message)}return}
  if(f.dataset.chat!==undefined){
    const v=$("#chatIn").value.trim(); if(!v) return;
    const corpo={texto:v}; if(f.dataset.chat)corpo.conversa_id=f.dataset.chat; if(f.dataset.ideia)corpo.ideia_id=f.dataset.ideia;
    try{const r=await api("/api/conversa",corpo); S.convData=r.conversa; if(!f.dataset.ideia){S.conv=r.conversa.id} acompanhar(r.job); await carregar(); scrollFim()}catch(er){toast(er.message)}
  }
});
carregar(); setInterval(()=>{if(!Object.values(S.jobs).some(j=>j.status==="rodando")&&document.visibilityState==="visible"&&!document.activeElement?.matches("textarea,input"))carregar()},10000);
</script>
</body>
