<title>Fábrica de Conteúdo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
/* Mesa de trabalho: coluna de pautas à esquerda, pauta aberta à direita; abas no topo. Marca Star Conect (marinho + sky). */
:root{
  --bg:#f4f6fa; --surface:#ffffff; --surface-2:#e9edf3; --line:#d5dbe6;
  --fg:#1a2547; --fg-2:#3d4658; --muted:#6b7488;
  --brand:#243263; --brand-ink:#ffffff; --sky:#2f8fbf; --sky-soft:#dcf0f9;
  --reels:#5b4bb7; --reels-soft:#ece9fb; --carr:#0f7a6a; --carr-soft:#e0f4ef;
  --ok:#2f7a3b; --ok-soft:#e3f2e5; --warn:#8a5a00; --warn-soft:#fbefd6; --bad:#a3322d;
  --f-sans:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1528; --surface:#172040; --surface-2:#1e2a52; --line:#2c3a68;
  --fg:#eef2fa; --fg-2:#c3cbe0; --muted:#8d97b3;
  --brand:#4eb5e0; --brand-ink:#0f1528; --sky:#4eb5e0; --sky-soft:#173a52;
  --reels:#b3a8f5; --reels-soft:#2a2558; --carr:#7fd9c6; --carr-soft:#123d38;
  --ok:#8fd49a; --ok-soft:#173a20; --warn:#f2c46b; --warn-soft:#3d2e0c; --bad:#f19a95;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1528; --surface:#172040; --surface-2:#1e2a52; --line:#2c3a68;
  --fg:#eef2fa; --fg-2:#c3cbe0; --muted:#8d97b3;
  --brand:#4eb5e0; --brand-ink:#0f1528; --sky:#4eb5e0; --sky-soft:#173a52;
  --reels:#b3a8f5; --reels-soft:#2a2558; --carr:#7fd9c6; --carr-soft:#123d38;
  --ok:#8fd49a; --ok-soft:#173a20; --warn:#f2c46b; --warn-soft:#3d2e0c; --bad:#f19a95;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:14px;line-height:1.55;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:14px 40px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand svg{width:22px;height:30px;flex:none}
.brand b{font-weight:600;font-size:16px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:12px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--fg-2);padding:7px 12px;border-radius:999px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--brand);color:var(--brand-ink);font-weight:500}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);font-size:13px}
.grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.label{font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.list{display:flex;flex-direction:column;gap:6px}
.item{all:unset;box-sizing:border-box;display:block;cursor:pointer;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.item[aria-current="true"]{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.item:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.item h3{margin:6px 0 2px;font-size:14px;font-weight:500;text-wrap:balance}
.meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap}
.chip{display:inline-block;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px}
.chip.reels{background:var(--reels-soft);color:var(--reels)}
.chip.carrossel{background:var(--carr-soft);color:var(--carr)}
.chip.st{background:var(--surface-2);color:var(--fg-2)}
.chip.st.publicada{background:var(--ok-soft);color:var(--ok)}
.chip.st.escolhida,.chip.st.gravada,.chip.st.designer{background:var(--sky-soft);color:var(--sky)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.panel h2{margin:6px 0 4px;font-size:20px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
a{color:var(--sky)}
.post{display:grid;gap:12px;margin-top:14px}
.block{background:var(--surface-2);border-radius:var(--r);padding:12px 14px;min-width:0}
.block p{margin:0;white-space:pre-wrap}
.slides{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.slide{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;aspect-ratio:4/5;max-width:100%;overflow:auto}
.slide b{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-bottom:4px}
.tags{font-family:var(--f-mono);font-size:12px;color:var(--fg-2)}
.chat{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.msgs{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.msg{max-width:88%;padding:8px 12px;border-radius:12px;font-size:13px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--brand);color:var(--brand-ink)}
.msg.a{align-self:flex-start;background:var(--surface-2)}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.btn{font:inherit;font-size:13px;font-weight:500;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn:disabled{opacity:.6;cursor:progress}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.hint{color:var(--muted);font-size:12px;margin:6px 0 0}
.rule{margin-top:8px;padding:10px 12px;border-radius:var(--r);background:var(--sky-soft);color:var(--fg);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{padding:28px 18px;text-align:center;color:var(--fg-2)}
.empty h2{font-size:18px;margin:0 0 6px}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:14px}
.pcard{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pcard p{margin:0;font-size:12px;color:var(--fg-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.why{margin-top:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .d{font-size:12px;font-variant-numeric:tabular-nums}
.d.up{color:var(--ok)} .d.down{color:var(--bad)}
.chart{margin-top:14px;overflow-x:auto}
.chart svg{display:block;width:100%;min-width:420px;height:auto}
.ctx dl{display:grid;grid-template-columns:minmax(0,160px) minmax(0,1fr);gap:8px 16px;margin:12px 0 0}
.ctx dt{color:var(--muted);font-size:12px}
.ctx dd{margin:0}
@media (max-width:560px){.ctx dl{grid-template-columns:minmax(0,1fr)}}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:14px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;min-width:0}
.col h3{margin:0 0 8px;font-size:12px;font-weight:500;color:var(--fg-2);display:flex;justify-content:space-between}
.col .item{padding:10px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="760.3 155.5 399.7 543.6" aria-hidden="true"><path fill="var(--brand)" d="M 1044.96875 538.519531 L 960.179688 477.128906 L 875.394531 538.519531 L 907.582031 438.910156 L 822.996094 377.246094 L 927.671875 377.074219 L 960.179688 277.574219 L 992.691406 377.074219 L 1097.367188 377.246094 L 1012.78125 438.910156 Z M 1151.574219 399.332031 C 1142.707031 335.433594 1088.078125 287.863281 1023.566406 287.863281 L 992.800781 287.863281 L 992.800781 169.128906 C 992.800781 161.359375 983.417969 157.457031 977.90625 162.933594 L 811.585938 328.253906 C 778.164062 361.472656 762.3125 408.480469 768.789062 455.15625 C 777.65625 519.050781 832.289062 566.621094 896.796875 566.621094 L 927.5625 566.621094 L 927.5625 685.359375 C 927.5625 693.125 936.945312 697.03125 942.457031 691.550781 L 1108.777344 526.234375 C 1142.199219 493.011719 1158.050781 446.007812 1151.574219 399.332031"/></svg>
      <div><b>Fábrica de Conteúdo</b><small id="who">Carregando seu perfil…</small></div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Seções">
      <button role="tab" data-tab="hoje" aria-selected="true">Hoje</button>
      <button role="tab" data-tab="fila" aria-selected="false">Fila</button>
      <button role="tab" data-tab="posts" aria-selected="false">Meus posts</button>
      <button role="tab" data-tab="comp" aria-selected="false">Comparativo</button>
      <button role="tab" data-tab="perfil" aria-selected="false">O que sei de você</button>
    </nav>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="view"></main>
</div>

<script>
const S = { tab:"hoje", perfil:null, pautas:[], noticias:[], posts:[], semanas:[], sel:null, selPost:null, busy:false, db:null, sample:null };
const $ = (q,el=document)=>el.querySelector(q);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => typeof n==="number" ? new Intl.NumberFormat("pt-BR",{notation:n>=10000?"compact":"standard",maximumFractionDigits:1}).format(n) : "—";
const hoje = () => new Date().toISOString().slice(0,10);
const STATUS = ["sugerida","escolhida","gravada","designer","publicada"];
const STATUS_TXT = {sugerida:"Sugerida",escolhida:"Escolhida",gravada:"Gravada",designer:"Com designer/social",publicada:"Publicada",descartada:"Descartada"};

function banner(t){ const b=$("#banner"); b.textContent=t||""; b.hidden=!t; }

function ctxText(){
  const p=S.perfil||{};
  return [
    `Perfil: @${p.handle||"?"} — ${p.nicho||""}`,
    `O que vende / faz: ${p.oferta||""}`,
    `Público: ${p.publico||""}`,
    `Objetivo padrão: Reels = ${p.objetivo_reels||"alcance"}; carrossel = ${p.objetivo_carrossel||"salvamentos"}`,
    `Voz: ${p.voz||""}`,
    `Regras de voz aprendidas: ${(p.regras||[]).join(" | ")||"nenhuma ainda"}`,
    `Nunca: ${(p.nunca||[]).join(" | ")||"—"}`,
    `Ângulos que funcionam aqui: ${(p.angulos||[]).join(", ")}`,
    `Formato de Reels: ${p.formato_reels||"falado para a câmera, até 40s"}`
  ].join("\n");
}

const POST_SHAPE = `{"resposta":"frase curta pra pessoa dizendo o que mudou","titulo":"...","gancho":"...","post":{"roteiro":"(só Reels) texto falado, frases curtas","slides":["(só carrossel) texto de cada slide"],"legenda":"...","hashtags":["#..."]},"regra_sugerida":"se o pedido parece preferência permanente de estilo, uma frase curta; senão null"}`;

/* ---------- render ---------- */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===S.tab)));
  const p=S.perfil;
  $("#who").textContent = p ? `@${p.handle} · ${p.nicho}${p.exemplo?" · dados de exemplo":""}` : "Sem perfil ainda";
  const v=$("#view");
  if(!S.db){ v.innerHTML = emptyNoDb(); return; }
  if(!p){ v.innerHTML = `<div class="panel empty" style="margin-top:16px"><h2>Seu painel nasce no primeiro /fabrica:comecar</h2><p>Abra o Claude no computador, na pasta da Fábrica, e digite <b>/fabrica:comecar</b>. As respostas e as primeiras pautas aparecem aqui.</p></div>`; return; }
  ({hoje:renderHoje,fila:renderFila,posts:renderPosts,comp:renderComp,perfil:renderPerfil})[S.tab](v);
}

function emptyNoDb(){
  return `<div class="panel empty" style="margin-top:16px"><h2>Abra o painel pelo Claude</h2><p>Este painel lê e guarda suas pautas na sua conta Claude. Abra pelo link que o <b>/fabrica:comecar</b> te deu, logado na sua conta.</p></div>`;
}

function pautaItem(x,cur){
  return `<button class="item" data-pauta="${esc(x.id)}" aria-current="${cur}">
    <span class="chip ${esc(x.tipo)}">${x.tipo==="carrossel"?"Carrossel":"Reels"}</span>
    ${x.status!=="sugerida"?` <span class="chip st ${esc(x.status)}">${esc(STATUS_TXT[x.status]||x.status)}</span>`:""}
    <h3>${esc(x.titulo)}</h3>
    <div class="meta">${x.fonte?.nome?`<span>Fonte: ${esc(x.fonte.nome)}</span>`:""}${x.angulo?`<span>${esc(x.angulo)}</span>`:""}</div>
  </button>`;
}

function renderHoje(v){
  const ativas=S.pautas.filter(x=>x.status!=="descartada"&&x.status!=="publicada").sort((a,b)=>(b.data||"").localeCompare(a.data||""));
  if(!S.sel || !ativas.find(x=>x.id===S.sel)) S.sel=ativas[0]?.id||null;
  const sel=S.pautas.find(x=>x.id===S.sel);
  const novas=S.noticias.filter(n=>!n.usada).length;
  v.innerHTML=`<div class="grid">
    <section aria-label="Pautas">
      <p class="label">Pautas abertas · ${ativas.length}</p>
      <div class="list">${ativas.map(x=>pautaItem(x,x.id===S.sel)).join("")||`<div class="panel empty"><p>Nenhuma pauta aberta. A próxima rotina traz novas, ou peça abaixo.</p></div>`}</div>
      <div style="margin-top:10px;display:grid;gap:6px">
        <button class="btn" id="nova" ${S.sample?"":"hidden"}>Trazer outro assunto</button>
        <p class="hint">${novas} notícia(s) da última busca ainda não viraram pauta.</p>
      </div>
    </section>
    <section class="panel" aria-label="Pauta aberta">${sel?pautaDetail(sel):`<div class="empty"><p>Escolha uma pauta à esquerda.</p></div>`}</section>
  </div>`;
}

function pautaDetail(x){
  const post=x.post||{};
  const isC=x.tipo==="carrossel";
  const conv=(x.conversa||[]).map(m=>`<div class="msg ${m.role==="user"?"u":"a"}">${esc(m.content)}</div>`).join("");
  return `
    <span class="chip ${esc(x.tipo)}">${isC?"Carrossel":"Reels"}</span> <span class="chip st ${esc(x.status)}">${esc(STATUS_TXT[x.status]||x.status)}</span>
    <h2>${esc(x.titulo)}</h2>
    <div class="meta">${x.fonte?.url?`<a href="${esc(x.fonte.url)}" target="_blank" rel="noopener">Fonte oficial: ${esc(x.fonte.nome||x.fonte.url)}</a>`:"<span>Sem fonte</span>"}${x.gancho?`<span>Gancho: ${esc(x.gancho)}</span>`:""}${(x.formato_video||x.formato_carrossel)?`<span>Formato: ${esc(x.formato_video||x.formato_carrossel)}${x.motivo_formato?" · "+esc(x.motivo_formato):""}</span>`:""}</div>
    <div class="post">
      ${!isC&&post.roteiro?`<div class="block"><p class="label">Roteiro falado</p><p>${esc(post.roteiro)}</p></div>`:""}
      ${isC&&post.slides?.length?`<div class="block"><p class="label">Slides · ${post.slides.length}</p><div class="slides">${post.slides.map((s,i)=>`<div class="slide"><b>${i+1}</b>${esc(s)}</div>`).join("")}</div></div>`:""}
      ${post.legenda?`<div class="block"><p class="label">Legenda</p><p>${esc(post.legenda)}</p></div>`:""}
      ${post.hashtags?.length?`<div class="block"><p class="label">Hashtags</p><p class="tags">${esc(post.hashtags.join(" "))}</p></div>`:""}
      ${!post.legenda&&!post.roteiro&&!post.slides?.length?`<div class="block"><p>Ainda não fabricado. Peça abaixo: “monta o post”.</p></div>`:""}
    </div>
    <div class="chat">
      <p class="label">Ajustar conversando</p>
      <div class="msgs" id="msgs">${conv}</div>
      <div id="rule"></div>
      ${S.sample?`<form class="ask" id="ask"><input id="askIn" autocomplete="off" placeholder="Ex.: deixa mais curto e começa pelo prejuízo" aria-label="Pedido de ajuste"><button class="btn primary" id="askBtn">Enviar</button></form>
      <p class="hint">Seu perfil, voz e objetivo já vão junto. Não precisa explicar de novo.</p>`
      :`<p class="hint">A conversa precisa do painel aberto dentro do Claude.</p>`}
    </div>
    <div class="actions">
      ${nextStatusButtons(x)}
      <button class="btn" data-copy="${esc(isC?`publica o carrossel da pauta "${x.titulo}" (id ${x.id})`:`manda a pauta "${x.titulo}" (id ${x.id}) pro designer e pro social`)}">${isC?"Copiar pedido de publicar":"Copiar pedido de entrega"}</button>
      <button class="btn" data-status="descartada">Descartar</button>
    </div>
    <p class="hint" id="copied" aria-live="polite"></p>`;
}

function nextStatusButtons(x){
  const i=STATUS.indexOf(x.status);
  const next=STATUS[i+1];
  if(!next) return "";
  const txt={escolhida:"Vou fazer essa",gravada:"Marcar gravado",designer:"Mandei pro designer/social",publicada:"Marcar publicado"}[next];
  return `<button class="btn primary" data-status="${next}">${txt}</button>`;
}

function renderFila(v){
  const cols=STATUS.map(s=>{
    const items=S.pautas.filter(x=>x.status===s);
    return `<div class="col"><h3><span>${STATUS_TXT[s]}</span><span>${items.length}</span></h3>${items.map(x=>pautaItem(x,false)).join("")}</div>`;
  }).join("");
  v.innerHTML=`<div style="margin-top:16px"><p class="label">Da sugestão à publicação</p><div class="board">${cols}</div></div>`;
}

function renderPosts(v){
  const ps=[...S.posts].sort((a,b)=>(b.views??b.curtidas??0)-(a.views??a.curtidas??0));
  const sel=ps.find(p=>p.id===S.selPost);
  v.innerHTML=`<div style="margin-top:16px">
    <p class="label">Seus posts, do que mais rendeu pro que menos · ${ps.length}</p>
    ${ps.length?"":`<div class="panel empty"><p>Os posts aparecem depois da primeira leitura do perfil (Apify ou print no /fabrica:comecar).</p></div>`}
    <div class="posts">${ps.map(p=>`<button class="pcard" data-post="${esc(p.id)}">
      <span class="chip ${p.formato==="carrossel"?"carrossel":"reels"}">${esc(p.formato||"post")}</span>
      <span class="big">${fmt(p.views??p.curtidas)}</span>
      <span class="meta"><span>${p.views!=null?"visualizações":"curtidas"}</span><span>${fmt(p.comentarios)} coment.</span></span>
      <p>${esc(p.legenda)}</p></button>`).join("")}</div>
    ${sel?`<div class="panel why"><p class="label">Por que esse funcionou</p><p style="margin:0 0 8px">${esc(sel.legenda)}</p>
      ${sel.url?`<a href="${esc(sel.url)}" target="_blank" rel="noopener">Abrir no Instagram</a>`:""}
      <div class="block" style="margin-top:10px"><p id="whyTxt">${esc(sel.porque||"")}</p></div>
      ${!sel.porque&&S.sample?`<button class="btn primary" id="whyBtn" style="margin-top:10px">Analisar esse post</button>`:""}</div>`:""}
  </div>`;
}

function renderComp(v){
  const w=[...S.semanas].sort((a,b)=>a.semana.localeCompare(b.semana));
  if(!w.length){ v.innerHTML=`<div class="panel empty" style="margin-top:16px"><p>O comparativo aparece depois da primeira leitura semanal.</p></div>`; return; }
  const last=w[w.length-1], prev=w[w.length-2]||{};
  const d=(a,b,suf="")=>{ if(a==null||b==null) return ""; const x=Math.round((a-b)*10)/10; return `<span class="d ${x>=0?"up":"down"}">${x>=0?"+":""}${x.toLocaleString("pt-BR")}${suf} vs semana anterior</span>`; };
  v.innerHTML=`<div style="margin-top:16px">
    <p class="label">Semana ${esc(last.semana)}</p>
    <div class="kpis">
      <div class="kpi"><div class="meta">Seguidores</div><div class="big">${fmt(last.seguidores)}</div>${d(last.seguidores,prev.seguidores)}</div>
      <div class="kpi"><div class="meta">Engajamento médio</div><div class="big">${last.engajamento!=null?last.engajamento.toLocaleString("pt-BR")+"%":"—"}</div>${d(last.engajamento,prev.engajamento," p.p.")}</div>
      <div class="kpi"><div class="meta">Posts na semana</div><div class="big">${fmt(last.posts)}</div>${d(last.posts,prev.posts)}</div>
    </div>
    <div class="panel chart" style="margin-top:12px"><p class="label">Seguidores por semana</p>${spark(w)}</div>
    ${last.referencias?.length?`<div class="panel" style="margin-top:12px"><p class="label">Você e suas referências (engajamento médio)</p>${refBars(last)}</div>`:""}
    ${last.leitura?`<div class="panel" style="margin-top:12px"><p class="label">Leitura do analista</p><p style="margin:0;white-space:pre-wrap">${esc(last.leitura)}</p></div>`:""}
  </div>`;
}

function spark(w){
  const W=640,H=180,pl=48,pr=16,pt=16,pb=28, vals=w.map(x=>x.seguidores||0);
  const min=Math.min(...vals), max=Math.max(...vals), span=(max-min)||1;
  const lo=Math.floor((min-span*0.1)), hi=Math.ceil(max+span*0.1);
  const X=i=>pl+(w.length===1?0:i*(W-pl-pr)/(w.length-1)), Y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const pts=vals.map((v,i)=>`${X(i)},${Y(v)}`).join(" ");
  const area=`${X(0)},${H-pb} ${pts} ${X(vals.length-1)},${H-pb}`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Seguidores por semana">
    ${[lo,Math.round((lo+hi)/2),hi].map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-8}" y="${Y(t)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmt(t)}</text>`).join("")}
    <polygon points="${area}" fill="var(--sky-soft)"/>
    <polyline points="${pts}" fill="none" stroke="var(--sky)" stroke-width="2"/>
    ${vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===vals.length-1?4.5:2.5}" fill="var(--sky)"/><text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(w[i].semana.slice(-3))}</text>`).join("")}
  </svg>`;
}

function refBars(last){
  const rows=[{handle:"você",engajamento:last.engajamento,me:true},...last.referencias];
  const max=Math.max(...rows.map(r=>r.engajamento||0))||1;
  return rows.map(r=>`<div style="display:grid;grid-template-columns:minmax(0,130px) minmax(0,1fr) 52px;gap:10px;align-items:center;margin:6px 0">
    <span style="font-size:13px;${r.me?"font-weight:600":""};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.me?"Você":"@"+esc(r.handle)}</span>
    <span style="height:10px;border-radius:5px;background:var(--surface-2)"><span style="display:block;height:100%;border-radius:5px;width:${(r.engajamento||0)/max*100}%;background:${r.me?"var(--brand)":"var(--muted)"}"></span></span>
    <span style="font-size:12px;font-variant-numeric:tabular-nums;text-align:right">${(r.engajamento??0).toLocaleString("pt-BR")}%</span></div>`).join("");
}

function renderPerfil(v){
  const p=S.perfil;
  const row=(k,val)=>`<dt>${k}</dt><dd>${esc(Array.isArray(val)?val.join(" · "):val||"—")}</dd>`;
  v.innerHTML=`<div class="panel ctx" style="margin-top:16px">
    <p class="label">O que a Fábrica já sabe de você</p>
    <p style="margin:0;color:var(--fg-2)">Tudo isso vai junto em cada pedido. Pra mudar, rode <b>/fabrica:comecar voz</b>, <b>/fabrica:comecar angulos</b> etc. no Claude, ou aceite uma regra quando ajustar um post.</p>
    <dl>${row("Perfil","@"+p.handle)}${row("Nicho",p.nicho)}${row("O que vende",p.oferta)}${row("Público",p.publico)}${row("Objetivo dos Reels",p.objetivo_reels)}${row("Objetivo dos carrosséis",p.objetivo_carrossel)}${row("Voz",p.voz)}${row("Regras aprendidas",p.regras)}${row("Nunca",p.nunca)}${row("Ângulos",p.angulos)}${row("Referências",p.referencias)}${row("Fontes de notícia",p.fontes)}${row("Cadência",p.cadencia)}</dl>
  </div>`;
}

/* ---------- ações ---------- */
document.addEventListener("click", async e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.tab){ S.tab=t.dataset.tab; render(); return; }
  if(t.dataset.pauta){ S.sel=t.dataset.pauta; S.tab="hoje"; render(); return; }
  if(t.dataset.post){ S.selPost=t.dataset.post; render(); return; }
  if(t.dataset.status){ await setStatus(S.sel,t.dataset.status); return; }
  if(t.dataset.copy){ copy(t.dataset.copy); return; }
  if(t.id==="nova"){ await novaPauta(t); return; }
  if(t.id==="whyBtn"){ await porQue(t); return; }
  if(t.id==="ruleYes"){ await aceitarRegra(t.dataset.rule); return; }
  if(t.id==="ruleNo"){ $("#rule").innerHTML=""; return; }
});
document.addEventListener("submit", async e=>{ if(e.target.id==="ask"){ e.preventDefault(); await ajustar(); } });

function copy(txt){
  const done=()=>{ const c=$("#copied"); if(c) c.textContent="Copiado. Cole no Claude, na pasta da Fábrica."; };
  try{ navigator.clipboard.writeText(txt).then(done,()=>fallback()); }catch{ fallback(); }
  function fallback(){ const c=$("#copied"); if(c) c.textContent=txt; }
}

async function setStatus(id,status){
  const x=S.pautas.find(p=>p.id===id); if(!x) return;
  try{ await S.db.doc("pautas/"+id).update({status, atualizado:new Date().toISOString()}); }
  catch(e){ banner("Não deu pra salvar o status. "+(e.message||"")); }
}

function errTxt(e){
  return ({not_granted:"Você não liberou o uso do Claude neste painel.",rate_limited:"Muitos pedidos seguidos. Espera um minuto.",invalid_json:"A resposta veio num formato que não deu pra ler. Tenta de novo pedindo de outro jeito."})[e?.code]||"Não deu certo agora. Tenta de novo.";
}

async function ajustar(){
  const inp=$("#askIn"), btn=$("#askBtn"); const pedido=inp.value.trim(); if(!pedido||S.busy) return;
  const x=S.pautas.find(p=>p.id===S.sel); if(!x) return;
  S.busy=true; btn.disabled=true; inp.value="";
  const msgs=$("#msgs"); msgs.insertAdjacentHTML("beforeend",`<div class="msg u">${esc(pedido)}</div><div class="msg a" id="pend">Pensando…</div>`);
  const conversa=[...(x.conversa||[]),{role:"user",content:pedido}];
  const prompt=`Você é a Fábrica de Conteúdo de Instagram desta pessoa. Contexto fixo dela:\n${ctxText()}\n\nPauta atual (JSON):\n${JSON.stringify({tipo:x.tipo,titulo:x.titulo,gancho:x.gancho,angulo:x.angulo,fonte:x.fonte,post:x.post||{}})}\n\nConversa até aqui:\n${conversa.map(m=>(m.role==="user"?"Pessoa: ":"Fábrica: ")+m.content).join("\n")}\n\nAtenda o último pedido. Pode trocar o assunto inteiro se ela pedir. Regras: nunca invente fato fora da fonte; se ela trouxer texto próprio, use do jeito dela; Reels é texto pra FALAR, frases curtas; legenda com gancho nos primeiros 125 caracteres, um CTA só, sem cara de IA (sem travessão, sem lista de emojis). Responda SÓ com JSON neste formato:\n${POST_SHAPE}`;
  try{
    const r=await S.sample.json(prompt,{cache:false,modelTier:"default"});
    if(!r||typeof r!=="object"||!r.post) throw {code:"invalid_json"};
    conversa.push({role:"assistant",content:String(r.resposta||"Feito.")});
    await S.db.doc("pautas/"+x.id).update({titulo:r.titulo||x.titulo,gancho:r.gancho||x.gancho,post:r.post,conversa:conversa.slice(-12),atualizado:new Date().toISOString()});
    if(r.regra_sugerida) offerRule(String(r.regra_sugerida));
  }catch(e){ const p=$("#pend"); if(p){ p.id=""; p.textContent=errTxt(e); } }
  finally{ S.busy=false; const b=$("#askBtn"); if(b) b.disabled=false; }
}

function offerRule(r){
  const el=$("#rule"); if(!el) return;
  el.innerHTML=`<div class="rule"><span>Guardar como regra pros próximos posts? <b>${esc(r)}</b></span><button class="btn primary" id="ruleYes" data-rule="${esc(r)}">Guardar</button><button class="btn" id="ruleNo">Só nesse</button></div>`;
}
async function aceitarRegra(r){
  const regras=[...(S.perfil.regras||[]),r];
  try{ await S.db.doc("perfil/atual").update({regras}); $("#rule").innerHTML=`<p class="hint">Regra guardada. Vale pra tudo daqui pra frente.</p>`; }
  catch(e){ banner("Não deu pra guardar a regra."); }
}

async function novaPauta(btn){
  if(S.busy) return; S.busy=true; btn.disabled=true; btn.textContent="Buscando um assunto…";
  const pool=S.noticias.filter(n=>!n.usada).slice(0,12);
  const usados=S.pautas.map(p=>p.titulo).slice(0,30);
  const prompt=`Você é a Fábrica de Conteúdo de Instagram desta pessoa. Contexto fixo:\n${ctxText()}\n\nNotícias recentes ainda não usadas (JSON, cada uma com id e link oficial):\n${JSON.stringify(pool)}\n\nPautas que já existem (não repita): ${usados.join(" | ")}\n\nEscolha a notícia com mais potencial PRA ESSE PÚBLICO e monte uma pauta nova. Se nenhuma notícia servir, proponha uma pauta de educação do nicho sem fonte (fonte null). Responda SÓ com JSON: {"noticia_id":"id ou null","tipo":"reels|carrossel","titulo":"...","gancho":"...","angulo":"...","fonte":{"nome":"...","url":"..."} ou null,"post":${POST_SHAPE.match(/"post":(\{.*?\]\})/)?.[1]||"{}"}}`;
  try{
    const r=await S.sample.json(prompt,{cache:false});
    if(!r?.titulo) throw {code:"invalid_json"};
    const ref=await S.db.collection("pautas").add({data:hoje(),tipo:r.tipo==="carrossel"?"carrossel":"reels",titulo:r.titulo,gancho:r.gancho||"",angulo:r.angulo||"",fonte:r.fonte||null,post:r.post||{},status:"sugerida",conversa:[],origem:"painel",exemplo:!!S.perfil.exemplo});
    if(r.noticia_id){ try{ await S.db.doc("noticias/"+r.noticia_id).update({usada:true}); }catch{} }
    S.sel=ref.id;
  }catch(e){ banner(errTxt(e)); }
  finally{ S.busy=false; render(); }
}

async function porQue(btn){
  const p=S.posts.find(x=>x.id===S.selPost); if(!p||S.busy) return;
  S.busy=true; btn.disabled=true; $("#whyTxt").textContent="Analisando…";
  const media=S.posts.reduce((a,x)=>a+(x.views??x.curtidas??0),0)/Math.max(1,S.posts.length);
  const prompt=`Contexto do perfil:\n${ctxText()}\n\nPost (JSON): ${JSON.stringify(p)}\nMédia do perfil: ${Math.round(media)}.\n\nEm até 5 linhas, em português simples: qual fórmula de gancho esse post usa, por que performou acima ou abaixo da média, e um molde em branco pra repetir o acerto. Sem markdown.`;
  try{
    const {text}=await S.sample(prompt,{onText:({text})=>{$("#whyTxt").textContent=text;}});
    await S.db.doc("posts/"+p.id).update({porque:text});
  }catch(e){ $("#whyTxt").textContent=errTxt(e); }
  finally{ S.busy=false; }
}

/* ---------- boot ---------- */
render();
(async()=>{
  if(!window.claude){ render(); return; }
  const [db,sample]=await Promise.all([claude.use("db"),claude.use("sample")]);
  S.db=db; S.sample=sample;
  if(!db){ render(); return; }
  const live=(coll,key)=>db.collection(coll).onSnapshot(s=>{ S[key]=s.docs.map(d=>({id:d.id,...d.data()})); render(); },()=>banner("Não deu pra ler "+coll+"."));
  db.doc("perfil/atual").onSnapshot(s=>{ S.perfil=s.exists?s.data():null; render(); },()=>banner("Não deu pra ler o perfil."));
  live("pautas","pautas"); live("noticias","noticias"); live("posts","posts"); live("semanas","semanas");
})();
</script>
